# --- Use vi keybindings in copy mode ---
setw -g mode-keys vi

# --- General appearance ---
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-style bg=colour236,fg=colour250

# --- Window title formatting ---
setw -g window-status-format "#[fg=colour250,bg=colour236] #I:#W "
setw -g window-status-current-format "#[fg=colour236,bg=colour97]#[fg=colour255,bg=colour97] #I:#W #[fg=colour97,bg=colour236]"

# --- 12-hour clock ---
set -g clock-mode-style 12


# --- Left Side: Rounded Arch icon + session name ---
set -g status-left "#[bg=colour97,fg=colour39]  #[bg=colour97,fg=colour255]#S #[fg=colour97,bg=colour236]"

# --- Right Side: Rounded date/time/host ---
set -g status-right "#[fg=colour97,bg=colour236]#[fg=colour255,bg=colour97] %I:%M %p | %m-%d-%Y"

# --- Plugin Manager (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- Other Plugins ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Prevent tmux-resurrect from adding extra window by killing default window before restore
set -g @resurrect-pre-restore-all 'tmux kill-window -t 0 2>/dev/null || true'

# --- Load TPM ---
run '~/.tmux/plugins/tpm/tpm'
